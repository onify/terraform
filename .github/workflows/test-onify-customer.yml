name: Test Terraform customer modules

on:
  pull_request:
    paths:
      - "modules/onify-customer/**"
      - "modules/onify-citizen/**"
      - ".github/workflows/test-onify-customer.yml"
  push:
    branches: [main]
    paths:
      - "modules/onify-customer/**"
      - "modules/onify-citizen/**"
      - ".github/workflows/test-onify-customer.yml"

permissions:
  contents: read

jobs:
  terraform-linux:
    name: Terraform 1.11.4 on Linux (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [onify-customer, onify-citizen]
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Initialize
        run: terraform init -backend=false -input=false
      - name: Test
        run: terraform test -no-color
      - name: Validate
        run: terraform validate -no-color
