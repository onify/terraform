name: Test onify-customer module

on:
  pull_request:
    paths:
      - "modules/onify-customer/**"
      - ".github/workflows/test-onify-customer.yml"
  push:
    branches: [main]
    paths:
      - "modules/onify-customer/**"
      - ".github/workflows/test-onify-customer.yml"

permissions:
  contents: read

jobs:
  terraform-linux:
    name: Terraform 1.11.4 on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/onify-customer
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Initialize
        run: terraform init -backend=false -input=false
      - name: Test
        run: terraform test -no-color
      - name: Validate
        run: terraform validate -no-color
