# Replace the example API URL. Put your issued bearer token in token.txt beside this file.
apiVersion: v1
kind: Config
clusters:
  - name: my-cluster
    cluster:
      server: https://api.example.com:6443
      # Uncomment if the API uses a private CA, and place ca.crt beside this file.
      # certificate-authority: ca.crt
users:
  - name: my-user
    user:
      tokenFile: token.txt
contexts:
  - name: my-context
    context:
      cluster: my-cluster
      user: my-user
current-context: my-context
