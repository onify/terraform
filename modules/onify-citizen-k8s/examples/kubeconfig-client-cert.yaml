# Replace the example IP and port. The server certificate must cover the address you use.
apiVersion: v1
kind: Config
clusters:
  - name: my-cluster
    cluster:
      server: https://192.0.2.10:6443
      certificate-authority: ca.crt
users:
  - name: my-user
    user:
      client-certificate: client.crt
      client-key: client.key
contexts:
  - name: my-context
    context:
      cluster: my-cluster
      user: my-user
current-context: my-context
